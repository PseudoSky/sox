# ci.yml — CI pipeline: nx affected build/lint/typecheck/test/validate
#
# Triggers on every push and pull_request targeting main.
# Uses `nx affected` so only changed packages (and their dependents) rebuild — B3.
#
# Flow:
#   1. Install dependencies
#   2. nx affected -t build     — compile only changed packages
#   3. nx affected -t lint      — lint only changed packages
#   4. nx affected -t typecheck — full `tsc --noEmit` on changed packages
#   5. nx affected -t test      — test only changed + dependent packages
#   6. validate-manifests       — full manifest conformance (read-only, fast)
#   7. registry drift gate      — registry/index.json must be up to date
#
# Note: releases run entirely through Changesets (`.changeset/config.json`,
# `release.yml`). There is no `nx release` in this repo — `nx.json` has no
# `release` key — so there is no dry-run release gate to gate a PR on.
#
# Why typecheck is a separate step from build: every bundled project builds
# through esbuild/atomic-tsc paths that strip types WITHOUT checking them, so a
# green `build` says nothing about type correctness (BL-248 — 15 real type
# errors, two of them live bugs, shipped through a green build,lint,test sweep).
#
# Tooling: actions/checkout@v4, pnpm/action-setup@v3 (reference-arch §6 row 9).

name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: nx affected build, lint, test + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for nx affected base resolution
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: nx affected build — only changed packages rebuild (B3)
      # --base=origin/main ensures we compare against the merge target, not HEAD~1.
      - name: Build (nx affected)
        run: pnpm exec nx affected -t build --base=origin/main --head=HEAD

      # Step 2: nx affected lint — only changed packages are linted
      - name: Lint (nx affected)
        run: pnpm exec nx affected -t lint --base=origin/main --head=HEAD

      # Step 3: nx affected typecheck — `tsc --noEmit` on changed packages.
      # Build strips types without checking them; this is the only gate that
      # actually typechecks (BL-248).
      - name: Typecheck (nx affected)
        run: pnpm exec nx affected -t typecheck --base=origin/main --head=HEAD

      # Step 4: nx affected test — changed packages + their dependents
      - name: Test (nx affected)
        run: pnpm exec nx affected -t test --base=origin/main --head=HEAD

      # Step 5: validate-manifests — full scan (read-only, fast; no filter needed)
      # --strict: DX-conformance advisory rules are errors; every extension must conform.
      - name: Validate extension manifests (strict)
        run: pnpm run validate-manifests -- --strict

      # Step 6: registry drift gate — regenerate and fail if stale
      - name: Registry index up to date
        run: |
          pnpm build-index
          git diff --exit-code registry/index.json \
            || (echo "::error::registry/index.json is stale — run 'pnpm build-index' and commit." && exit 1)
