# ci.yml — CI pipeline: nx affected build/lint/typecheck/test/validate
#
# Triggers on every push and pull_request targeting main.
# Uses `nx affected` so only changed packages (and their dependents) rebuild — B3.
#
# Flow:
#   1. Install dependencies
#   2. nx affected -t build     — compile only changed packages
#   3. nx affected -t lint      — lint only changed packages
#   4. nx affected -t typecheck — full `tsc --noEmit` on changed packages
#   5. nx affected -t test      — test only changed + dependent packages
#   6. validate-manifests       — full manifest conformance (read-only, fast)
#   7. registry drift gate      — registry/index.json must be up to date
#
# Note: releases run entirely through Changesets (`.changeset/config.json`,
# `release.yml`). There is no `nx release` in this repo — `nx.json` has no
# `release` key — so there is no dry-run release gate to gate a PR on.
#
# Why typecheck is a separate step from build: every bundled project builds
# through esbuild/atomic-tsc paths that strip types WITHOUT checking them, so a
# green `build` says nothing about type correctness (BL-248 — 15 real type
# errors, two of them live bugs, shipped through a green build,lint,test sweep).
#
# Tooling: actions/checkout@v4, pnpm/action-setup@v3 (reference-arch §6 row 9).

name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: nx affected build, lint, test + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for nx affected base resolution
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: nx affected build — only changed packages rebuild (B3)
      # --base=origin/main ensures we compare against the merge target, not HEAD~1.
      - name: Build (nx affected)
        run: pnpm exec nx affected -t build --base=origin/main --head=HEAD

      # Step 2: nx affected lint — only changed packages are linted
      - name: Lint (nx affected)
        run: pnpm exec nx affected -t lint --base=origin/main --head=HEAD

      # Step 3: nx affected typecheck — `tsc --noEmit` on changed packages.
      # Build strips types without checking them; this is the only gate that
      # actually typechecks (BL-248).
      - name: Typecheck (nx affected)
        run: pnpm exec nx affected -t typecheck --base=origin/main --head=HEAD

      # Step 4: nx affected test — changed packages + their dependents
      - name: Test (nx affected)
        run: pnpm exec nx affected -t test --base=origin/main --head=HEAD

      # BL-466 — Tier 1 regression guards, full and unfiltered (the drift safety net for guards
      # whose watched files didn't change locally but a dependency drifted under them anyway —
      # the exact bl313 failure shape). Runs after Build so dist/ is fresh for anything it touches.
      - name: Guards — tier 1 (full, unfiltered)
        run: pnpm exec nx run sox-ecosystem:guards-tier1

      # BL-466 — Tier 2 (dist-dependent) regression guards. No --isolate-worktree: a GitHub
      # Actions runner is already a disposable, single-job checkout with no concurrent agents to
      # protect against (the risk --isolate-worktree exists for is BL-235/BL-456 in a shared dev
      # checkout, which does not apply here).
      - name: Guards — tier 2 (dist-dependent)
        run: node tools/run-guards.mjs --tier2

      # Step 5: validate-manifests — full scan (read-only, fast; no filter needed)
      # --strict: DX-conformance advisory rules are errors; every extension must conform.
      - name: Validate extension manifests (strict)
        run: pnpm run validate-manifests -- --strict

      # Published-bytes gate (backlog fbde8dda-d6ed-4b6b-9cde-9495351a7c35 /
      # 3df6f848-c5c4-4cf3-92dc-6490fb043fde). Compares EVERY `npm-package:` row in
      # the COMMITTED registry/index.json against the bytes npm currently serves for
      # the version in that row's own locator. Catches the outage class the drift gate
      # structurally cannot: a local rebuild with no version bump keeps the correct
      # locator while the generator re-pins `checksum` to new LOCAL bytes, so every
      # install dies with CHECKSUM MISMATCH (memory-server@1.3.3: 4ea74857 vs 6a4168d7).
      #
      # This inspects the COMMITTED registry/index.json. Nothing in this job may run a
      # generator before it (or at all) — `pnpm build-index` REWRITES the file from local
      # disk bytes, and inspecting CI's own regenerated file is the CI-bytes-vs-CI-bytes
      # tautology that makes a post-publish-only check worthless. See the RETIRED note below.
      #
      # Not gated on any publication signal and not path-filtered: six HTTPS GETs is
      # cheap, and always-run is a superset of "any push touching registry/index.json".
      # Fails closed — an unreachable npm registry is reported UNREACHABLE and exits 1
      # (distinct from MISMATCH); `--no-remote` is refused outright when CI is set.
      - name: Registry checksums match published npm bytes
        run: pnpm run check-published-bytes

      # RETIRED — there is deliberately NO registry-regeneration step here.
      # This job used to run `pnpm build-index` and then
      # `git diff --exit-code registry/index.json`, failing with
      # "registry/index.json is stale - run 'pnpm build-index' and commit."
      # That instruction is the OUTAGE PROCEDURE: `build-index` re-derives every
      # row's `source` into file:// / jsdelivr locators and re-pins every
      # `checksum` from LOCAL DISK BYTES, which is the mechanism recorded in
      # scripts/lib/published-bytes.ts as the cause of the CHECKSUM MISMATCH
      # outage. Committing its output replaces the 6-row publication pin with 31
      # file:// rows. It could never have gone green either: the disk walk yields
      # 31 rows against the registry's 6, because `resolveSource` only emits
      # `npm-package:` locators under SOX_REGISTRY_PUBLISH, a release-path signal
      # this job does not set. Registry-vs-disk equality is simply the wrong
      # invariant — the registry is a PUBLICATION PIN, not a mirror of the tree.
      #
      # It is replaced by two assertions that are both satisfiable and
      # load-bearing, neither of which generates anything:
      #   1. the published-bytes step above (every npm-package: row's checksum
      #      equals the bytes npm serves — currently 6/6), and
      #   2. its coverage gate (registry/published-coverage.json: no row may
      #      silently lose its npm-package: locator, and an empty verified set
      #      is never a pass).
      # Generation belongs in .github/workflows/release.yml, and nowhere else.
      # Enforced by scripts/ci-no-generator-in-verify.test.ts.
