# validate.yml — PR validation: build + manifests + typecheck + tests + changeset status
#
# Runs on every pull request targeting main.
# Filtered to packages changed vs HEAD~1 using pnpm --filter "...[HEAD~1]".
#
# Steps (per reference-architecture §6):
#   1. build               — compile each extension package src/ → dist/ (prerequisite for gate 2)
#   2. validate-manifests  — id-format, type/dir match, dedup, secret-in-config, entrypoint-reachability
#   3. typecheck           — tsc --noEmit across all workspace packages (blocking gate)
#   4. test                — vitest run (all extension + script tests)
#   5. changeset status    — confirms changeset file is present for changed packages
#
# Ordering constraint: build MUST precede validate-manifests because the P0
# entrypoint-reachability gate asserts that dist/index.js exists for each extension.
# typecheck MUST precede test (catches type errors before running the suite).
#
# Hard constraint: do NOT add a behavioral agent/prompt eval step here —
# that is gated on the P5.5 research spike (migration.md P5.5).
#
# Tooling: actions/checkout@v4, pnpm/action-setup@v3 (reference-arch §6 row 9).

name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate manifests, types, tests, and changeset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for changeset status and --filter "...[HEAD~1]"
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: build — compile each extension package's src/index.ts to dist/index.js
      # P0: framework-owned build subsystem. Each process-type extension package (mcp-server,
      # hook, agent, skill, command) has a per-package tsconfig.json that compiles src/ → dist/.
      # MUST run before validate-manifests so the entrypoint-reachability gate can assert
      # that dist/index.js exists for each registered extension.
      - name: Build extension packages
        run: pnpm -r build

      # Step 2: validate-manifests — id-format, type/dir invariant, dedup, secret-in-config,
      # and entrypoint-reachability (requires dist/ from step 1).
      # Runs against the full extension tree (read-only, no filter needed — fast).
      # --strict: DX-conformance advisory rules are errors (fail-closed). Safe since P5
      # retrofitted all 11 extensions to conform; any non-conforming extension will red-bar CI.
      - name: Validate extension manifests (strict)
        run: pnpm run validate-manifests -- --strict

      # Published-bytes gate (backlog fbde8dda-d6ed-4b6b-9cde-9495351a7c35 /
      # 3df6f848-c5c4-4cf3-92dc-6490fb043fde). Compares EVERY `npm-package:` row in
      # the COMMITTED registry/index.json against the bytes npm currently serves for
      # the version in that row's own locator. Catches the outage class the drift gate
      # structurally cannot: a local rebuild with no version bump keeps the correct
      # locator while the generator re-pins `checksum` to new LOCAL bytes, so every
      # install dies with CHECKSUM MISMATCH (memory-server@1.3.3: 4ea74857 vs 6a4168d7).
      #
      # This inspects the COMMITTED registry/index.json. Nothing in this job may run a
      # generator before it (or at all) — `pnpm build-index` REWRITES the file from local
      # disk bytes, and inspecting CI's own regenerated file is the CI-bytes-vs-CI-bytes
      # tautology that makes a post-publish-only check worthless. See the RETIRED note below.
      #
      # Not gated on any publication signal and not path-filtered: six HTTPS GETs is
      # cheap, and always-run is a superset of "any push touching registry/index.json".
      # Fails closed — an unreachable npm registry is reported UNREACHABLE and exits 1
      # (distinct from MISMATCH); `--no-remote` is refused outright when CI is set.
      - name: Registry checksums match published npm bytes
        run: pnpm run check-published-bytes

      # RETIRED — there is deliberately NO registry-regeneration step here.
      # This job used to run `pnpm build-index` and then
      # `git diff --exit-code registry/index.json`, failing with
      # "registry/index.json is stale - run 'pnpm build-index' and commit."
      # That instruction is the OUTAGE PROCEDURE: `build-index` re-derives every
      # row's `source` into file:// / jsdelivr locators and re-pins every
      # `checksum` from LOCAL DISK BYTES, which is the mechanism recorded in
      # scripts/lib/published-bytes.ts as the cause of the CHECKSUM MISMATCH
      # outage. Committing its output replaces the 6-row publication pin with 31
      # file:// rows. It could never have gone green either: the disk walk yields
      # 31 rows against the registry's 6, because `resolveSource` only emits
      # `npm-package:` locators under SOX_REGISTRY_PUBLISH, a release-path signal
      # this job does not set. Registry-vs-disk equality is simply the wrong
      # invariant — the registry is a PUBLICATION PIN, not a mirror of the tree.
      #
      # It is replaced by two assertions that are both satisfiable and
      # load-bearing, neither of which generates anything:
      #   1. the published-bytes step above (every npm-package: row's checksum
      #      equals the bytes npm serves — currently 6/6), and
      #   2. its coverage gate (registry/published-coverage.json: no row may
      #      silently lose its npm-package: locator, and an empty verified set
      #      is never a pass).
      # Generation belongs in .github/workflows/release.yml, and nowhere else.
      # Enforced by scripts/ci-no-generator-in-verify.test.ts.

      # Step 3: typecheck — tsc --noEmit across all workspace packages (blocking gate)
      # Runs on all packages; filter is not applied here because type errors in
      # unchanged packages can surface from changed dependency types.
      # MUST be a blocking step — failures here prevent the test suite from running.
      - name: Typecheck
        run: pnpm typecheck

      # Step 3b: nx cache conformance — every cacheable build/test target must be
      # dependency-aware (BL-44 guard). Prevents a regression to the "cache lies" bug.
      - name: nx cache conformance
        run: pnpm run check-nx-cache

      # Step 4: test — vitest run, filtered to packages changed vs HEAD~1
      # "--filter ...[HEAD~1]" matches the changed package(s) AND their dependents.
      - name: Run tests (changed packages + dependents)
        run: pnpm --filter "...[HEAD~1]" run test --passWithNoTests 2>/dev/null || pnpm run test

      # Step 5: changeset status — confirm a changeset file exists for this PR
      # Exits non-zero if no changeset is present (forces contributors to bump versions).
      # Use --since to compare from the base branch.
      - name: Changeset status
        run: pnpm changeset status --since=origin/main
