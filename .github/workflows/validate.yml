# validate.yml — PR validation: build + manifests + typecheck + tests + changeset status
#
# Runs on every pull request targeting main.
# Filtered to packages changed vs HEAD~1 using pnpm --filter "...[HEAD~1]".
#
# Steps (per reference-architecture §6):
#   1. build               — compile each extension package src/ → dist/ (prerequisite for gate 2)
#   2. validate-manifests  — id-format, type/dir match, dedup, secret-in-config, entrypoint-reachability
#   3. typecheck           — tsc --noEmit across all workspace packages (blocking gate)
#   4. test                — vitest run (all extension + script tests)
#   5. changeset status    — confirms changeset file is present for changed packages
#
# Ordering constraint: build MUST precede validate-manifests because the P0
# entrypoint-reachability gate asserts that dist/index.js exists for each extension.
# typecheck MUST precede test (catches type errors before running the suite).
#
# Hard constraint: do NOT add a behavioral agent/prompt eval step here —
# that is gated on the P5.5 research spike (migration.md P5.5).
#
# Tooling: actions/checkout@v4, pnpm/action-setup@v3 (reference-arch §6 row 9).

name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate manifests, types, tests, and changeset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for changeset status and --filter "...[HEAD~1]"
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: build — compile each extension package's src/index.ts to dist/index.js
      # P0: framework-owned build subsystem. Each process-type extension package (mcp-server,
      # hook, agent, skill, command) has a per-package tsconfig.json that compiles src/ → dist/.
      # MUST run before validate-manifests so the entrypoint-reachability gate can assert
      # that dist/index.js exists for each registered extension.
      - name: Build extension packages
        run: pnpm -r build

      # Step 2: validate-manifests — id-format, type/dir invariant, dedup, secret-in-config,
      # and entrypoint-reachability (requires dist/ from step 1).
      # Runs against the full extension tree (read-only, no filter needed — fast).
      # --strict: DX-conformance advisory rules are errors (fail-closed). Safe since P5
      # retrofitted all 11 extensions to conform; any non-conforming extension will red-bar CI.
      - name: Validate extension manifests (strict)
        run: pnpm run validate-manifests -- --strict

      # Step 2.5: registry drift — regenerate registry/index.json and fail if it changed.
      # The registry stores per-extension sha256 checksums of source artifacts; `sox update`
      # (and any checksum-verifying install) FAILS when the committed index is stale relative
      # to the source. This gate forces the index to be regenerated (`pnpm build-index`)
      # whenever source changes, so checksums can never silently drift out of sync.
      - name: Registry index up to date
        run: |
          pnpm build-index
          git diff --exit-code registry/index.json \
            || (echo "::error::registry/index.json is stale — run 'pnpm build-index' and commit." && exit 1)

      # Step 3: typecheck — tsc --noEmit across all workspace packages (blocking gate)
      # Runs on all packages; filter is not applied here because type errors in
      # unchanged packages can surface from changed dependency types.
      # MUST be a blocking step — failures here prevent the test suite from running.
      - name: Typecheck
        run: pnpm typecheck

      # Step 3b: nx cache conformance — every cacheable build/test target must be
      # dependency-aware (BL-44 guard). Prevents a regression to the "cache lies" bug.
      - name: nx cache conformance
        run: pnpm run check-nx-cache

      # Step 4: test — vitest run, filtered to packages changed vs HEAD~1
      # "--filter ...[HEAD~1]" matches the changed package(s) AND their dependents.
      - name: Run tests (changed packages + dependents)
        run: pnpm --filter "...[HEAD~1]" run test --passWithNoTests 2>/dev/null || pnpm run test

      # Step 5: changeset status — confirm a changeset file exists for this PR
      # Exits non-zero if no changeset is present (forces contributors to bump versions).
      # Use --since to compare from the base branch.
      - name: Changeset status
        run: pnpm changeset status --since=origin/main
