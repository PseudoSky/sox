[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-sim"
version = "0.1.0"
description = "Deterministic discrete-event simulation of an agentic software-delivery pipeline: independent bucket/merge axes, a time model, and a compounding test cost (spec 2026-10-05, H1)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["simpy>=4.1,<5"]

[project.optional-dependencies]
test = ["pytest>=7"]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
# `ui` = the Streamlit design-space explorer (app.py).  It bundles the viz deps
# so a single `pip install -e '.[ui]'` gives a working explorer.
ui = ["streamlit>=1.37", "matplotlib>=3.8", "plotly>=5.20"]

[project.scripts]
pipeline-sim = "pipeline_sim.harness:main"
pipeline-sim-plots = "pipeline_sim.plots:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
